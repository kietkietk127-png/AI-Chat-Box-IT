
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot của tôi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 400px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 5px; max-width: 80%; word-break: break-word; white-space: pre-wrap; }
        .user-message { background: #007bff; color: white; align-self: flex-end; }
        .ai-message { background: #e9ecef; color: black; align-self: flex-start; }
        .chat-input { display: flex; padding: 10px; gap: 5px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        .chat-input button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message ai-message">Xin chào! Tôi là AI chatbot của bạn. Tôi có thể giúp gì?</div>
    </div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    // Thay chuỗi bên dưới bằng API Key thật của bạn lấy từ Google AI Studio
    
constAPI_KEY="AQ.Ab8RN6LRzc8ThcaCh7Sj9uHJzRrrYDdR0aDMcF0m3H85sFFUg" ;

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = inputField.value.trim();
        
        if (!text) return;
        if (API_KEY === "YOUR_API_KEY_HERE") {
            alert("Vui lòng thay thế API Key thực tế vào biến API_KEY trong mã nguồn!");
            return;
        }

        // Hiển thị tin nhắn người dùng
        chatBox.innerHTML += `<div class="message user-message">${escapeHtml(text)}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Tạo khung tin nhắn chờ phản hồi từ AI
        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'message ai-message';
        aiMessageDiv.textContent = 'Đang suy nghĩ...';
        chatBox.appendChild(aiMessageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Gọi trực tiếp Gemini API (sử dụng model gemini-2.5-flash hoặc gemini-1.5-flash)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: text }]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiReply = data.candidates[0].content.parts[0].text;
                aiMessageDiv.textContent = aiReply;
            } else {
                aiMessageDiv.textContent = "Xin lỗi, đã có lỗi xảy ra khi phản hồi từ AI.";
            }
        } catch (error) {
            console.error(error);
            aiMessageDiv.textContent = "Không thể kết nối đến máy chủ AI.";
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
