<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot của tôi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 400px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 5px; max-width: 80%; word-break: break-word; }
        .user-message { background: #007bff; color: white; align-self: flex-end; }
        .ai-message { background: #e9ecef; color: black; align-self: flex-start; }
        .chat-input { display: flex; padding: 10px; gap: 5px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        .chat-input button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message ai-message">Xin chào! Tôi là AI chatbot của bạn. Tôi có thể giúp gì?</div>
    </div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn...">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = inputField.value.trim();
        
        if (!text) return;

        // Hiển thị tin nhắn người dùng
        chatBox.innerHTML += `<div class="message user-message">${text}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Mô phỏng phản hồi từ AI (Bạn có thể thay thế bằng đoạn gọi Fetch API thực tế tới Google Gemini hoặc dịch vụ AI khác tại đây)
        setTimeout(() => {
            chatBox.innerHTML += `<div class="message ai-message">AI đã nhận: "${text}". Hãy cấu hình thêm API Key để AI trả lời thông minh nhé!</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 1000);
    }
</script>

</body>
</html>
